<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Germania+One&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Pixelify+Sans:wght@500;600&display=swap" rel="stylesheet">

<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (error) {}
    if (saved !== 'light' && saved !== 'dark') saved = null;

    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
  })();
</script>

<style>
  :root,
  [data-theme="light"] {
    --bg: #f5f5f0;
    --bg-alt: #efefe9;
    --text: #1a1a1a;
    --text-muted: #555;
    --text-faint: #888;
    --border: rgba(0, 0, 0, 0.1);
    --border-light: rgba(0, 0, 0, 0.05);
    --accent: #3f6212;
    --accent-bg: rgba(63, 98, 18, 0.15);
    --topbar-bg: rgba(239, 239, 233, 0.95);
    --tooltip-border: rgba(0, 0, 0, 0.15);
    --tooltip-shadow: rgba(0, 0, 0, 0.1);
  }

  [data-theme="dark"] {
    --bg: #121212;
    --bg-alt: #1a1a1a;
    --text: #e8e6e1;
    --text-muted: #a8a6a3;
    --text-faint: #666;
    --border: rgba(255, 255, 255, 0.1);
    --border-light: rgba(255, 255, 255, 0.05);
    --accent: #ffb3ba;
    --accent-bg: rgba(255, 179, 186, 0.15);
    --topbar-bg: rgba(18, 18, 18, 0.95);
    --tooltip-border: rgba(255, 255, 255, 0.15);
    --tooltip-shadow: rgba(0, 0, 0, 0.5);
  }

  :root {
    --font-display: 'Germania One', cursive;
    --font-heading: 'Pixelify Sans', sans-serif;
    --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-main: var(--font-heading);
    --font-secondary: var(--font-body);
    --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
    --font-scale: 15px;
    --background-color: var(--bg);
    --heading-color: var(--text);
    --text-color: var(--text);
    --link-color: var(--text);
    --visited-color: var(--text);
    --blockquote-color: var(--text-muted);
  }

  html {
    color-scheme: light;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
  }

  body {
    max-width: none;
    margin: 0;
    padding: 0;
    background-color: var(--bg);
    color: var(--text);
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  /* ── Top bar (darker, sticky, full-width) ── */
  body > header {
    position: sticky;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: var(--topbar-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: background 0.25s ease, border-color 0.25s ease;
  }

  body > header a.title {
    text-decoration: none;
    color: var(--text);
  }

  body > header a.title h2 {
    font-family: var(--font-display);
    font-size: clamp(0.78rem, 1.8vw, 1rem);
    font-weight: 400;
    line-height: 1.3;
    margin: 0;
    color: var(--text);
    letter-spacing: 0;
    transition: color 0.2s;
  }

  body > header a.title:hover h2 {
    color: var(--accent);
  }

  body > header nav {
    display: flex;
    gap: 18px;
    align-items: center;
    margin-left: auto;
  }

  body > header nav a {
    color: var(--text-muted);
    font-family: var(--font-heading);
    text-decoration: none;
    font-size: 0.95em;
    font-weight: 500;
    letter-spacing: 0.5px;
    margin-right: 0;
    transition: color 0.2s;
  }

  body > header nav a:hover,
  body > header nav a.is-active {
    color: var(--accent);
  }

  body > header nav a.is-active {
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 5px;
  }

  .theme-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-muted);
    padding: 0;
    transition: border-color 0.2s, background 0.2s, color 0.2s;
  }

  .theme-toggle:hover {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--text);
  }

  .theme-toggle svg {
    width: 15px;
    height: 15px;
    display: none;
  }

  [data-theme="light"] .theme-toggle .icon-moon { display: block; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }

  /* ── Main content (lighter bg, centered) ── */
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
    line-height: 1.6;
  }

  /* ── Blog index ── */
  .blog-index {
    position: relative;
    left: 50%;
    width: min(1040px, calc(100vw - 40px));
    transform: translateX(-50%);
  }

  .blog-index-header {
    max-width: 680px;
    margin: clamp(16px, 4vw, 48px) 0 clamp(32px, 5vw, 52px);
  }

  .blog-index-eyebrow {
    margin: 0 0 12px;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .blog-index-intro {
    color: var(--text-muted);
    font-size: clamp(1rem, 1.4vw, 1.15rem);
    line-height: 1.65;
  }

  .blog-index-intro p {
    margin: 0;
  }

  .post-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .post-row {
    margin: 0;
  }

  .post-row-link {
    display: grid;
    grid-template-columns: minmax(110px, 160px) 1fr;
    gap: clamp(16px, 4vw, 48px);
    align-items: baseline;
    padding: clamp(18px, 2.5vw, 26px) clamp(12px, 2vw, 20px);
    border-radius: 6px;
    color: var(--text);
    text-decoration: none;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .post-row-link:visited {
    color: var(--text);
  }

  .post-row-link:hover,
  .post-row-link:focus-visible {
    background: var(--accent-bg);
    color: var(--accent);
    text-decoration: none;
  }

  .post-row-link time {
    color: var(--text-faint);
    font-size: clamp(0.68rem, 1.2vw, 0.78rem);
    letter-spacing: 0.04em;
  }

  .post-row-link h2 {
    margin: 0;
    color: inherit;
    font-size: clamp(1.55rem, 3.4vw, 2.4rem);
    transition: color 0.2s ease;
  }

  .post-list-empty {
    color: var(--text-muted);
  }

  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
    color: var(--text-faint);
    font-size: 0.85em;
  }

  /* ── Typography ── */
  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-heading);
    color: var(--text);
    line-height: 1.2;
  }

  h1 {
    font-size: clamp(2rem, 7vw, 2.75rem);
  }

  code, pre, time, kbd, samp {
    font-family: var(--font-mono);
  }

  /* ── Post subtitle ── */
  main content .post-subtitle {
    font-size: 0.85em;
    color: var(--text-muted);
    margin: -8px 0 24px;
    line-height: 1.5;
  }

  /* ── Content links: inherit text color, underlined ── */
  main content a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
    position: relative;
  }

  main content a:visited {
    color: inherit;
  }

  main content a:hover,
  main content a:focus-visible {
    color: var(--accent);
  }

  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* ── URL preview tooltip on hover ── */
  main content a[data-href]:hover::after {
    content: attr(data-href);
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 4px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--tooltip-border);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.78em;
    font-family: var(--font-mono);
    text-decoration: none;
    white-space: nowrap;
    max-width: 80vw;
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 100;
    box-shadow: 0 2px 8px var(--tooltip-shadow);
    pointer-events: none;
  }

  @media (max-width: 520px) {
    body > header {
      padding: 0 12px;
      gap: 10px;
    }

    body > header a.title h2 {
      font-size: clamp(0.62rem, 3vw, 0.78rem);
    }

    body > header nav {
      gap: 8px;
    }

    body > header nav a {
      font-size: 0.82em;
    }

    main {
      padding-top: 24px;
    }

    .blog-index {
      width: calc(100vw - 32px);
    }

    .blog-index-header {
      margin-top: 8px;
    }

    .post-row-link {
      grid-template-columns: minmax(96px, 110px) 1fr;
      gap: 12px;
      padding-inline: 8px;
    }
  }

  @media (max-width: 390px) {
    body > header nav a.nav-link--rss {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    body,
    body > header,
    body > header a.title h2,
    .post-row-link,
    .post-row-link h2 {
      transition: none;
    }
  }
</style>
