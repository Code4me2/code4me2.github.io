<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script>
  (function () {
    var saved = localStorage.getItem('theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

<style>
  :root,
  [data-theme="light"] {
    --bg: #f5f5f0;
    --bg-alt: #efefe9;
    --text: #1a1a1a;
    --text-muted: #555;
    --text-faint: #888;
    --border: rgba(0, 0, 0, 0.1);
    --border-light: rgba(0, 0, 0, 0.05);
    --accent: #2563eb;
    --accent-bg: #dbeafe;
    --topbar-bg: rgba(239, 239, 233, 0.95);
    --tooltip-border: rgba(0, 0, 0, 0.15);
    --tooltip-shadow: rgba(0, 0, 0, 0.1);
  }

  [data-theme="dark"] {
    --bg: #141414;
    --bg-alt: #0e0e0e;
    --text: #e8e8e8;
    --text-muted: #999;
    --text-faint: #666;
    --border: rgba(255, 255, 255, 0.1);
    --border-light: rgba(255, 255, 255, 0.05);
    --accent: #7dd3fc;
    --accent-bg: rgba(125, 211, 252, 0.15);
    --topbar-bg: rgba(14, 14, 14, 0.95);
    --tooltip-border: rgba(255, 255, 255, 0.15);
    --tooltip-shadow: rgba(0, 0, 0, 0.5);
  }

  :root {
    --font-main: 'Playfair Display', Georgia, serif;
    --font-secondary: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
    --font-scale: 15px;
    --background-color: var(--bg);
    --heading-color: var(--text);
    --text-color: var(--text);
    --link-color: var(--text);
    --visited-color: var(--text);
    --blockquote-color: var(--text-muted);
  }

  body {
    max-width: none;
    margin: 0;
    padding: 0;
    background-color: var(--bg);
    color: var(--text);
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  /* ── Top bar (darker, sticky, full-width) ── */
  body > header {
    position: sticky;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: var(--topbar-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: background 0.25s ease, border-color 0.25s ease;
  }

  body > header a.title {
    text-decoration: none;
    color: var(--text);
  }

  body > header a.title h2 {
    font-family: var(--font-main);
    font-size: 1.4em;
    font-weight: 700;
    margin: 0;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  body > header nav {
    display: flex;
    gap: 18px;
    align-items: center;
    margin-left: auto;
  }

  body > header nav a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.85em;
    font-weight: 500;
    letter-spacing: 0.5px;
    transition: color 0.2s;
  }

  body > header nav a:hover {
    color: var(--text);
  }

  .theme-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-muted);
    padding: 0;
    transition: border-color 0.2s, background 0.2s, color 0.2s;
  }

  .theme-toggle:hover {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--text);
  }

  .theme-toggle svg {
    width: 15px;
    height: 15px;
    display: none;
  }

  [data-theme="light"] .theme-toggle .icon-moon { display: block; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }

  /* ── Main content (lighter bg, centered) ── */
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
    line-height: 1.6;
  }

  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
    color: var(--text-faint);
    font-size: 0.85em;
  }

  /* ── Typography ── */
  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-main);
    color: var(--text);
  }

  code, pre, time, kbd, samp {
    font-family: var(--font-mono);
  }

  /* ── Post subtitle ── */
  main content .post-subtitle {
    font-size: 0.85em;
    color: var(--text-muted);
    margin: -8px 0 24px;
    line-height: 1.5;
  }

  /* ── Content links: inherit text color, underlined ── */
  main content a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
    position: relative;
  }

  main content a:visited {
    color: inherit;
  }

  /* ── URL preview tooltip on hover ── */
  main content a[data-href]:hover::after {
    content: attr(data-href);
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 4px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--tooltip-border);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.78em;
    font-family: var(--font-mono);
    text-decoration: none;
    white-space: nowrap;
    max-width: 80vw;
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 100;
    box-shadow: 0 2px 8px var(--tooltip-shadow);
    pointer-events: none;
  }
</style>
