  .ibd-playback { position: absolute; top: 4px; right: 4px; display: none;

const MODELS = PUB.map(m => ({ ...m, inf: false })).concat(INF.map(m => ({ ...m, inf: true })));

/* ---------- scales ---------- */

const X0 = 12.1, X1 = 15.9;                        // release date
const Y0 = Math.log10(2.3), Y1 = Math.log10(6000); // log params (reaches 3.4B active)
const Z0 = 0, Z1 = 105;                            // mean % of frontier

const W = 940, H = 640, S = 330, CXP = 470, CYP = 318;

const nx = t => (t - X0) / (X1 - X0) - 0.5;
const ny = p => (Math.log10(p) - Y0) / (Y1 - Y0) - 0.5;
const nz = m => ((m - Z0) / (Z1 - Z0) - 0.5) * 0.82;

/* camera states: flat 2D front view -> tilted perspective view */
const YAW_FLAT = -Math.PI / 2, PITCH_FLAT = 0;
const YAW_3D = -Math.PI / 4, PITCH_3D = 0.26;
const PK = 0.3; // perspective strength at persp=1

const XT = [[12.3, "Aug '26"], [13.3, "Sep '26"], [14.3, "Oct '26"], [15.3, "Nov '26"]];
const YT = [[3, "3B"], [10, "10B"], [30, "30B"], [100, "100B"], [300, "300B"], [1000, "1T"], [3000, "3T"]];
const ZT = [[0, "0"], [20, "20"], [40, "40"], [60, "60"], [80, "80"], [100, "100"]];

/* ---------- rendering ---------- */

const f1 = v => v.toFixed(1);
const f3 = v => v.toFixed(3);

function renderScene(a, b, persp, modeT) {
  const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b);
  const zf = S * (1 + 0.55 * (1 - persp)); // flat 2D view fills the canvas, pulls back into 3D
  const P = (x, y, z) => {
    const u = -x * sa + y * ca;
    const v = -x * sb * ca - y * sb * sa + z * cb;
    const d = x * cb * ca + y * cb * sa + z * sb;
    const f = 1 / (1 - persp * PK * d);
    return [CXP + zf * u * f, CYP - zf * v * f, d, f];
  };
  const line = (p, q, cls, style) =>
    `<line x1="${f1(p[0])}" y1="${f1(p[1])}" x2="${f1(q[0])}" y2="${f1(q[1])}" class="${cls}"${style || ""}/>`;

  let grid = "", labels = "", fade = "";

  // grid panes: far walls x=X0 and y=Y1, floor z=Z0 (camera stays at +x/−y octant)
  for (const [xt] of XT) {
    grid += line(P(nx(xt), -0.5, nz(Z0)), P(nx(xt), 0.5, nz(Z0)), "gl");
    grid += line(P(nx(xt), 0.5, nz(Z0)), P(nx(xt), 0.5, nz(Z1)), "gl");
  }
  for (const [zt] of ZT) {
    grid += line(P(-0.5, -0.5, nz(zt)), P(-0.5, 0.5, nz(zt)), "gl");
    grid += line(P(-0.5, 0.5, nz(zt)), P(0.5, 0.5, nz(zt)), "gl");
  }
  // parameter-axis grid only matters once the third dimension is visible
  for (const [yt] of YT) {
    fade += line(P(-0.5, ny(yt), nz(Z0)), P(0.5, ny(yt), nz(Z0)), "gl");
    fade += line(P(-0.5, ny(yt), nz(Z0)), P(-0.5, ny(yt), nz(Z1)), "gl");
  }
  grid += line(P(-0.5, -0.5, nz(Z0)), P(0.5, -0.5, nz(Z0)), "gl ge");
  grid += line(P(-0.5, -0.5, nz(Z0)), P(-0.5, -0.5, nz(Z1)), "gl ge");
  fade += line(P(0.5, -0.5, nz(Z0)), P(0.5, 0.5, nz(Z0)), "gl ge");

  // tick labels: dates on the front-bottom edge, capability up the left edge
  for (const [xt, lab] of XT) {
    const p = P(nx(xt), -0.5, nz(Z0));
    labels += `<text x="${f1(p[0] - 6)}" y="${f1(p[1] + 16)}" class="tick">${lab}</text>`;
  }
  for (const [zt, lab] of ZT) {
    const p = P(-0.5, -0.5, nz(zt));
    labels += `<text x="${f1(p[0] - 9)}" y="${f1(p[1] + 4)}" class="tick te">${lab}</text>`;
  }
  const tx = P(nx(13.9), -0.56, nz(Z0) - 0.09);
  labels += `<text x="${f1(tx[0])}" y="${f1(tx[1] + 22)}" class="title">Release date</text>`;
  const tz = P(-0.5, -0.5, nz(Z1) + 0.09);
  labels += `<text x="${f1(tz[0] - 10)}" y="${f1(tz[1] - 6)}" class="title">Mean % of frontier, 5 benchmarks</text>`;
  // parameter ticks appear with the rotation
  for (const [yt, lab] of YT) {
    const p = P(0.5, ny(yt), nz(Z0));
    fade += `<text x="${f1(p[0] + 10)}" y="${f1(p[1] + 12)}" class="tick">${lab}</text>`;
  }
  const ty = P(0.62, ny(120), nz(Z0) - 0.09);
  fade += `<text x="${f1(ty[0] + 8)}" y="${f1(ty[1] + 24)}" class="title">Parameters, log scale</text>`;

  // markers, far-to-near. modeT slides each MoE dot from its total-parameter
  // position (0) to its active-parameter position (1), trailing a thin tail
  // back to the total anchor. Dense models don't move; closed models fade.
  const pts = MODELS.map((m, i) => {
    const x = nx(m.t), yTot = ny(m.p);
    const anchor = P(x, yTot, nz(m.m));
    const moves = !m.inf && m.ap !== m.p;
    const dot = moves ? P(x, yTot + (ny(m.ap) - yTot) * modeT, nz(m.m)) : anchor;
    return { m, i, dot, anchor, moves };
  }).sort((u, v) => u.dot[2] - v.dot[2]);

  let marks = "";
  for (const { m, i, dot, anchor, moves } of pts) {
    const rDot = (m.inf ? 4.5 : 5.5) * dot[3];
    let g = "";
    if (moves && modeT > 0.02) g += line(anchor, dot, "tail", ` stroke="${m.c}"`);
    const dim = m.inf ? ` style="opacity:${f3(0.5 - 0.32 * modeT)}"` : "";
    g += `<circle cx="${f1(dot[0])}" cy="${f1(dot[1])}" r="${f1(rDot)}"${m.inf ? "" : ` fill="${m.c}"`} class="dot${m.inf ? " dim" : ""}"${dim}/>`;
    g += `<circle cx="${f1(dot[0])}" cy="${f1(dot[1])}" r="11" class="hit"/>`;
    marks += `<g class="pt" data-i="${i}" tabindex="0" role="img" aria-label="${m.n}, ${m.lab}: mean ${m.m.toFixed(1)} percent of frontier">${g}</g>`;
  }
  return `<g class="grid" aria-hidden="true">${grid}</g>` +
    `<g class="grid gfade" aria-hidden="true" style="opacity:${f3(persp)}">${fade}</g>` +
    `<g class="labels" aria-hidden="true">${labels}</g>` +
    `<g class="marks">${marks}</g>`;
}

/* ---------- browser runtime ---------- */

function initRuntime() {
  const root = document.querySelector("[data-ibd-root]");
  if (!root) return;
  const svg = root.querySelector("svg");
  const scene = svg.querySelector("[data-scene]");
  const tip = root.querySelector(".ibd-tip");
  const btn = root.querySelector(".ibd-playback");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
  const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  const inputs = [...root.querySelectorAll(".ibd-seg input")];
  let raf = 0, timer = 0, playing = false, played = false, modeT = 0;
  const cam = { a: YAW_3D, b: PITCH_3D };
  const drawFlat = () => { scene.innerHTML = renderScene(YAW_FLAT, PITCH_FLAT, 0, 0); };
  const drawFinal = () => { scene.innerHTML = renderScene(cam.a, cam.b, 1, modeT); };
  const setToggle = on => inputs.forEach(el => { el.disabled = !on; });
  const setReady = () => { played = true; root.classList.add("ibd-ready"); setToggle(true); };

  const setState = s => {
    if (!btn) return;
    btn.dataset.playback = s;
    btn.disabled = s === "playing";
    btn.setAttribute("aria-label", s === "finished" ? "Replay the figure" :
      s === "playing" ? "Playing" : "Play the figure");
    btn.title = btn.getAttribute("aria-label");
  };

  const tween = (dur, fn, done) => {
    const t0 = performance.now();
    const step = now => {
      const t = Math.min(1, (now - t0) / dur);
      fn(t);
      if (t < 1) raf = requestAnimationFrame(step);
      else if (done) done();
    };
    raf = requestAnimationFrame(step);
  };

  const play = () => {
    if (playing) return;
    if (reduced.matches) { drawFinal(); setState("finished"); setReady(); return; }
    playing = true;
    cam.a = YAW_3D; cam.b = PITCH_3D;
    setState("playing");
    setToggle(false);
    hideTip();
    drawFlat();
    // after a beat, rotate into the third dimension; the parameter toggle
    // and free orbit take over from there
    timer = window.setTimeout(() => {
      tween(1700, t => {
        const e = ease(t);
        scene.innerHTML = renderScene(
          YAW_FLAT + (YAW_3D - YAW_FLAT) * e,
          PITCH_FLAT + (PITCH_3D - PITCH_FLAT) * e, e, modeT * e);
      }, () => { playing = false; setState("finished"); setReady(); });
    }, 500);
  };

  /* free orbit with the cursor once the intro has played */
  let drag = null;
  svg.addEventListener("pointerdown", e => {
    if (!played || playing) return;
    drag = { x: e.clientX, y: e.clientY, a: cam.a, b: cam.b };
    svg.setPointerCapture(e.pointerId);
    root.classList.add("ibd-grabbing");
    hideTip();
  });
  svg.addEventListener("pointermove", e => {
    if (!drag) return;
    cam.a = Math.max(YAW_3D - 1.0, Math.min(YAW_3D + 1.0, drag.a - (e.clientX - drag.x) * 0.005));
    cam.b = Math.max(0.05, Math.min(1.1, drag.b + (e.clientY - drag.y) * 0.004));
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(drawFinal);
  });
  const endDrag = () => { drag = null; root.classList.remove("ibd-grabbing"); };
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);

  /* total ↔ active parameter toggle: the dot glides along the parameter
     axis, trailing a thin tail back to its total-parameter anchor */
  inputs.forEach(el => el.addEventListener("change", () => {
    const target = el.value === "active" ? 1 : 0;
    cancelAnimationFrame(raf);
    if (reduced.matches) { modeT = target; drawFinal(); return; }
    const from = modeT;
    tween(650, t => {
      modeT = from + (target - from) * easeOut(t);
      drawFinal();
    });
  }));

  const stop = () => {
    window.clearTimeout(timer);
    cancelAnimationFrame(raf);
    playing = false;
  };

  /* tooltips (event delegation — marks are re-created each frame) */
  const fp = p => (p >= 1000 ? (p / 1000).toFixed(1) + "T" : (p < 100 ? p.toFixed(1) : p.toFixed(0)) + "B");
  const hov = m => {
    let s = `<b>${m.n}</b> — ${m.lab}<br>${m.d}<br>` +
      (m.inf ? `~${fp(m.p)} total (inferred)` : `${fp(m.p)} total / ${fp(m.ap)} active · ${m.sp}× sparse`) +
      `<br>mean ${m.m.toFixed(1)}% of frontier`;
    s += m.k > 1 ? ` (${m.lo.toFixed(1)}–${m.hi.toFixed(1)} across ${m.k})` : " (1 benchmark)";
    for (const b in m.raw) s += `<br>&nbsp;&nbsp;${b}: ${m.raw[b]} → ${m.fr[b].toFixed(1)}%`;
    return s;
  };
  const showTip = g => {
    const m = MODELS[+g.dataset.i];
    const dot = g.querySelector(".dot");
    tip.innerHTML = hov(m);
    tip.hidden = false;
    const rb = root.getBoundingClientRect(), db = dot.getBoundingClientRect();
    const x = db.left - rb.left + db.width / 2, y = db.top - rb.top;
    tip.style.left = Math.max(8, Math.min(rb.width - tip.offsetWidth - 8, x - tip.offsetWidth / 2)) + "px";
    tip.style.top = (y < tip.offsetHeight + 16 ? y + 18 : y - tip.offsetHeight - 10) + "px";
    g.classList.add("hot");
  };
  const hideTip = () => {
    tip.hidden = true;
    svg.querySelectorAll(".pt.hot").forEach(g => g.classList.remove("hot"));
  };
  svg.addEventListener("pointerover", e => {
    const g = e.target.closest(".pt");
    if (g && !playing && !drag) showTip(g);
  });
  svg.addEventListener("pointerout", e => {
    if (!e.relatedTarget || !e.relatedTarget.closest(".pt")) hideTip();
  });
  svg.addEventListener("focusin", e => { const g = e.target.closest(".pt"); if (g) showTip(g); });
  svg.addEventListener("focusout", hideTip);

  if (btn) btn.addEventListener("click", () => { stop(); playing = false; play(); });
  reduced.addEventListener("change", () => { if (reduced.matches) { stop(); drawFinal(); setState("finished"); } });

  root.classList.add("ibd-js");

  /* debug hooks for build-time screenshots */
  if (location.hash === "#flat") { drawFlat(); setState("paused"); return; }
  if (location.hash === "#final" || location.hash === "#active") {
    if (location.hash === "#active") { modeT = 1; const a = inputs.find(el => el.value === "active"); if (a) a.checked = true; }
    drawFinal(); setState("finished"); setReady(); return;
  }

  if (reduced.matches) { drawFinal(); setState("finished"); setReady(); return; }

  // start flat; play once when the reader has scrolled the figure well into view
  drawFlat();
  setState("paused");
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(entries => {
      if (played || playing) return;
      if (entries.some(e => e.isIntersecting && e.intersectionRatio >= 0.65)) {
        io.disconnect();
        play();
      }
    }, { threshold: 0.65, rootMargin: "0px 0px -10% 0px" });
    io.observe(root);
  } else {
    play();
  }
}

if (typeof document !== "undefined") initRuntime();
if (typeof module !== "undefined") module.exports = { renderScene, W, H, YAW_3D, PITCH_3D };

</script>
</div>
